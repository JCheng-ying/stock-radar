<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock Radar · 产业链信息处理器</title>
<style>
:root{
  --bg:#0e1116;--panel:#161b22;--panel2:#1c232d;--line:#2a323d;--text:#e6e9ee;--muted:#8b96a5;--faint:#5d6875;
  --up:#f0555a;--down:#2fb574;--cold:#4c9aff;--hot:#ff9a3d;--accent:#c9a45c;
  --w1:#9d8cff;--w2:#3fc1c9;--w3:#f08bb4;--ok:#2fb574;--no:#6b7785;
  --r:10px;
}
@media (prefers-color-scheme:light){:root{
  --bg:#f5f6f8;--panel:#fff;--panel2:#f0f2f5;--line:#dfe3e8;--text:#1b2230;--muted:#5f6b7a;--faint:#98a2b0;
  --up:#d93a40;--down:#1a9a5c;--cold:#2b7de0;--hot:#e07a12;--accent:#9a7426;--w1:#6b57e0;--w2:#1697a0;--w3:#d4568a;--no:#a3adba;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.num{font-variant-numeric:tabular-nums;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.93em}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{max-width:1320px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.hd h1{font-size:16px;margin:0;letter-spacing:.5px}
.hd h1 b{color:var(--accent)}
.hd .asof{color:var(--muted);font-size:12px}
.hd input{margin-left:auto;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;width:210px;font:inherit}
nav{max-width:1320px;margin:0 auto;padding:6px 16px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 12px;font:inherit;cursor:pointer;white-space:nowrap}
nav button:hover{color:var(--text)}
nav button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1320px;margin:0 auto;padding:16px}
h2{font-size:15px;margin:26px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2 small{color:var(--muted);font-weight:400;font-size:12px}
h3{font-size:13px;margin:0 0 8px;color:var(--muted);font-weight:600;letter-spacing:.3px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12px}
.up{color:var(--up)}.down{color:var(--down)}
ul.why{margin:8px 0 0;padding:0;list-style:none}
ul.why li{padding:3px 0 3px 14px;position:relative;color:var(--muted);font-size:13px}
ul.why li:before{content:"";position:absolute;left:2px;top:11px;width:5px;height:5px;border-radius:50%;background:var(--faint)}
.big{font-size:26px;font-weight:650;line-height:1.1}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--line);white-space:nowrap}
.sig2{background:color-mix(in srgb,var(--cold) 22%,transparent);border-color:var(--cold);color:var(--cold);font-weight:600}
.sig1{border-color:color-mix(in srgb,var(--cold) 60%,var(--line));color:var(--cold)}
.sig0{color:var(--muted)}
.sig-1{border-color:color-mix(in srgb,var(--hot) 60%,var(--line));color:var(--hot)}
.sig-2{background:color-mix(in srgb,var(--hot) 22%,transparent);border-color:var(--hot);color:var(--hot);font-weight:600}
.wv{font-size:11px;padding:0 6px;border-radius:4px;font-weight:600}
.wv1{background:color-mix(in srgb,var(--w1) 20%,transparent);color:var(--w1)}
.wv2{background:color-mix(in srgb,var(--w2) 20%,transparent);color:var(--w2)}
.wv3{background:color-mix(in srgb,var(--w3) 20%,transparent);color:var(--w3)}
.lv0{color:var(--muted)}.lv1{color:var(--cold)}.lv2{color:var(--w2)}.lv3{color:var(--accent)}.lv4{color:var(--hot)}
/* 热度条：蓝=悲观 橙=乐观 */
.heat{position:relative;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--cold),color-mix(in srgb,var(--cold) 25%,var(--panel2)) 38%,var(--panel2) 50%,color-mix(in srgb,var(--hot) 25%,var(--panel2)) 62%,var(--hot));margin:10px 0 4px}
.heat i{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:var(--text);transform:translateX(-2px);box-shadow:0 0 0 2px var(--panel)}
.heat-l{display:flex;justify-content:space-between;font-size:11px;color:var(--faint)}
.bar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:right;color:var(--muted);font-weight:500;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--panel)}
th.s{cursor:pointer}th.s:hover{color:var(--text)}
td{padding:6px 8px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);text-align:right;white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}
td.wrap{white-space:normal;color:var(--muted);font-size:12px;min-width:150px}
tr.row{cursor:pointer}tr.row:hover td{background:var(--panel2)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.tk{font-weight:650}
.nc{opacity:.55}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px 12px;margin-top:8px}
.kv div span{display:block;color:var(--muted);font-size:11px}
.kv div b{font-weight:600}
.checks{margin:10px 0 0;padding:0;list-style:none}
.checks li{display:grid;grid-template-columns:18px 1fr;gap:4px;padding:3px 0;font-size:13px}
.checks .t{color:var(--muted);font-size:12px}
.ck1{color:var(--ok)}.ck0{color:var(--no)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
.tabs button.on{color:var(--text);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
.diagram{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.diagram svg{display:block;width:100%;height:auto}
.nd rect{fill:var(--panel2);stroke:var(--line);stroke-width:1.2;cursor:pointer;transition:stroke .15s}
.nd:hover rect.b{stroke:var(--faint)}
.nd.sel rect.b{stroke:var(--accent);stroke-width:2}
.nd.dim{opacity:.35}
.nd text{fill:var(--text);font-size:12.5px;pointer-events:none}
.nd .sub{fill:var(--muted);font-size:10.5px}
.ed{fill:none;stroke:var(--faint);stroke-width:1.3;opacity:.55}
.ed.hi{stroke:var(--accent);opacity:1;stroke-width:2}
.ed.dim{opacity:.12}
.el{font-size:10.5px;fill:var(--accent);paint-order:stroke;stroke:var(--panel);stroke-width:4px}
.axis{fill:var(--faint);font-size:11px}
.note{border-left:3px solid var(--accent);padding:6px 12px;background:var(--panel2);border-radius:0 8px 8px 0;margin:8px 0;font-size:13px}
.note b{color:var(--accent)}
.feed{margin:0;padding:0;list-style:none}
.feed li{padding:8px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent);font-size:13px}
.feed li:last-child{border:0}
.feed .m{color:var(--faint);font-size:11px}
.feed a{text-decoration:none}.feed a:hover{text-decoration:underline}
/* 公司弹窗 */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;overflow-y:auto;padding:24px 12px}
#modal.on{display:block}
.mbox{max-width:1080px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:18px 20px 24px;position:relative}
.mclose{position:absolute;right:14px;top:10px;background:none;border:0;color:var(--muted);font-size:24px;cursor:pointer}
.mh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-right:30px}
.mh .t{font-size:24px;font-weight:700}
.facet h3{display:flex;justify-content:space-between;align-items:baseline}
.facet h3 em{font-style:normal;font-size:20px;color:var(--text);font-weight:650}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:10px}
.mini figure{margin:0}.mini figcaption{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.legend{font-size:11px;color:var(--faint);margin-top:28px;border-top:1px solid var(--line);padding-top:12px}
.empty{color:var(--faint);padding:14px 0;font-size:13px}
@media (max-width:640px){.g2,.g3{grid-template-columns:1fr}.hd input{width:100%;margin:0}.big{font-size:22px}}

/* 物品栏 + 3D 拆解 */
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.slot{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:16px 14px;cursor:pointer;transition:transform .12s,border-color .12s;position:relative;min-height:150px}
.slot:hover{transform:translateY(-2px);border-color:var(--accent)}
.slot.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.slot .ic{font-size:40px;line-height:1;margin-bottom:10px}
.slot b{display:block;font-size:14px}
.slot .ct{position:absolute;right:12px;top:12px;text-align:right;font-size:11px;color:var(--muted);line-height:1.5}
.slot p{margin:6px 0 0;font-size:12px;color:var(--muted);line-height:1.45}
.pv{display:grid;grid-template-columns:260px 1fr;gap:12px;margin-top:12px}
.plist{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px;max-height:600px;overflow:auto}
.plist h4{margin:10px 6px 4px;font-size:11px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px;letter-spacing:.5px}
.plist h4 i{width:9px;height:9px;border-radius:2px;display:inline-block}
.plist button{display:flex;width:100%;justify-content:space-between;gap:8px;text-align:left;background:none;border:0;color:var(--text);font:inherit;font-size:13px;padding:5px 8px;border-radius:6px;cursor:pointer}
.plist button:hover{background:var(--panel2)}
.plist button.on{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);font-weight:600}
.plist button span{color:var(--faint);font-size:11px;white-space:nowrap}
.stagewrap{position:relative;background:radial-gradient(ellipse at 50% 40%,var(--panel2),var(--bg) 75%);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
#stage{height:600px;position:relative;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
#stage canvas{display:block}
.lb{position:absolute;transform:translate(-50%,-50%);font-size:11px;padding:1px 6px;border-radius:5px;background:color-mix(in srgb,var(--bg) 78%,transparent);border:1px solid var(--line);color:var(--text);white-space:nowrap;pointer-events:auto;cursor:pointer;user-select:none}
.lb.on{border-color:var(--accent);color:var(--accent);font-weight:600;z-index:3}
.lb:hover{border-color:var(--faint);z-index:4}
.ctl{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.ctl input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
.ctl button,.back{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
.hint{position:absolute;left:12px;top:10px;font-size:11px;color:var(--faint);pointer-events:none}
.auto{font-size:10px;padding:0 5px;border-radius:4px;border:1px dashed var(--faint);color:var(--muted)}
@media (max-width:820px){.pv{grid-template-columns:1fr}.plist{max-height:220px;order:2}#stage{height:420px}}

details{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
details>summary{cursor:pointer;color:var(--accent);font-size:12px;list-style:none;user-select:none}
details>summary::-webkit-details-marker{display:none}
details>summary:before{content:"▸ ";}details[open]>summary:before{content:"▾ ";}
.rule{font-size:12px;color:var(--muted);margin:2px 0 0}
.src{font-size:11px;color:var(--faint)}.src a{color:var(--faint)}
table.calc td,table.calc th{white-space:normal;font-size:12px;vertical-align:top}
table.fin td,table.fin th{font-size:12px;padding:4px 8px}
table.fin td:first-child{position:sticky;left:0;background:var(--panel);color:var(--muted)}
table.fin tr.sep td{border-top:1px solid var(--line)}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--down);margin-right:4px;vertical-align:middle}
.doc h3{font-size:14px;color:var(--text);margin:18px 0 6px}.doc p,.doc li{font-size:13px;color:var(--muted);margin:4px 0}.doc ul{margin:4px 0;padding-left:18px}
.doc code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--panel2);padding:1px 5px;border-radius:4px;color:var(--text)}
</style>
</head>
<body>
<header>
  <div class="hd">
    <h1><b>Stock Radar</b> · 产业链信息处理器</h1>
    <span class="asof" id="asof"></span><span class="asof" id="livest"></span>
    <input id="q" placeholder="搜索代码或公司名…" autocomplete="off">
  </div>
  <nav id="nav"></nav>
</header>
<main id="app"></main>
<div id="modal"><div class="mbox"><button class="mclose" onclick="closeCo()">×</button><div id="mbody"></div></div></div>
<script>/*__THREE__*/</script>
<script>const DATA=/*__DATA__*/null;</script>
<script>
"use strict";
const C=DATA.companies, S=DATA.sectors, M=DATA.market;
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||"")?esc(u):"#";
const has=x=>x!==null&&x!==undefined&&!Number.isNaN(x);
const pct=(x,d=0)=>has(x)?(x>0?"+":"")+(x*100).toFixed(d)+"%":"—";
const pct0=(x,d=0)=>has(x)?(x*100).toFixed(d)+"%":"—";
const pp=x=>has(x)?(x>0?"+":"")+(x*100).toFixed(1)+"pp":"—";
const num=(x,d=1)=>has(x)?Number(x).toFixed(d):"—";
const cls=x=>!has(x)||x===0?"":x>0?"up":"down";
const money=x=>{if(!has(x))return"—";const a=Math.abs(x),s=x<0?"-":"";return a>=1e12?s+(a/1e12).toFixed(2)+"T":a>=1e9?s+(a/1e9).toFixed(1)+"B":a>=1e6?s+(a/1e6).toFixed(0)+"M":s+a.toFixed(0)};
const sc=(x)=>has(x)?`<span class="num">${x}</span>`:`<span class="faint">—</span>`;
const sig=s=>`<span class="chip sig${s.level}">${esc(s.label)}</span>`;
const WN=["","一浪","二浪","三浪"];
const wv=w=>`<span class="wv wv${w}">${WN[w]}</span>`;
const heatOnly=h=>has(h)?`<div class="heat"><i style="left:${h}%"></i></div>`:"";
const heatBar=h=>has(h)?heatOnly(h)+`<div class="heat-l"><span>极度悲观 · 利空已定价</span><span>极度乐观 · 利好已消化</span></div>`:"";
const heatColor=h=>!has(h)?"inherit":h>=65?"var(--hot)":h<=38?"var(--cold)":"inherit";
const REL={partnership:"合作",competition:"竞争",supplier:"供应",customer:"客户",investment:"投资",research_collaboration:"研究合作",acquisition:"收购",subsidiary:"子公司"};

/* ---------- 小图表（纯 SVG） ---------- */
function line(vals,{w=260,h=56,color="var(--accent)",fill=true,marks=[]}={}){
  const v=vals.filter(has); if(v.length<2)return"";
  const mv=marks.map(m=>m.v).filter(has);
  const mn=Math.min(...v,...mv),mx=Math.max(...v,...mv),r=mx-mn||1;
  const X=i=>i/(vals.length-1)*w, Y=y=>h-3-(y-mn)/r*(h-6);
  const pts=vals.map((y,i)=>has(y)?`${X(i).toFixed(1)},${Y(y).toFixed(1)}`:null).filter(Boolean);
  const first=vals.findIndex(has);
  const ml=marks.filter(m=>has(m.v)).map(m=>`<line x1="0" x2="${w}" y1="${Y(m.v)}" y2="${Y(m.v)}" stroke="${m.c}" stroke-dasharray="3 3" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="none" style="height:${h}px;display:block">${fill?`<polygon points="${X(first)},${h} ${pts.join(" ")} ${w},${h}" fill="${color}" opacity=".1"/>`:""}${ml}<polyline points="${pts.join(" ")}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
}
function bars(vals,{w=150,h=46,color="var(--accent)",signed=false}={}){
  if(!vals.some(has))return`<div class="empty">无数据</div>`;
  const v=vals.map(x=>has(x)?x:0);
  const mx=Math.max(...v.map(Math.abs))||1, neg=v.some(x=>x<0), base=neg?h/2:h-1, k=neg?(h/2-2)/mx:(h-3)/mx;
  const bw=w/v.length;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="height:${h}px;display:block" preserveAspectRatio="none">${v.map((x,i)=>{const bh=Math.abs(x)*k;const c=signed?(x>=0?"var(--up)":"var(--down)"):color;return`<rect x="${(i*bw+bw*.15).toFixed(1)}" y="${(x>=0?base-bh:base).toFixed(1)}" width="${(bw*.7).toFixed(1)}" height="${Math.max(bh,.5).toFixed(1)}" fill="${c}" opacity="${i==v.length-1?1:.55}" rx="1.5"/>`}).join("")}${neg?`<line x1="0" x2="${w}" y1="${base}" y2="${base}" stroke="var(--line)"/>`:""}</svg>`;
}

/* ---------- 导航 ---------- */
const TABS=[["overview","总览"],...S.map(s=>["s:"+s.id,s.name]),["earn","财报"],["all","全部公司"],["alerts","推送记录"],["method","判断标准"]];
let state={tab:"overview",chain:{},node:{},prod:{},part:{},sort:{k:"sig",d:-1},filter:{sector:"",signal:""}};
function go(tab){state.tab=tab;history.replaceState(null,"","#"+tab);render();window.scrollTo(0,0)}
function render(){
  $("#nav").innerHTML=TABS.map(([k,n])=>`<button class="${state.tab===k?"on":""}" onclick="go('${k}')">${n}</button>`).join("");
  const t=state.tab;
  $("#app").innerHTML=(t==="overview"?overview():t==="all"?allCos():t==="alerts"?alertsPage():t==="earn"?earnPage():t==="method"?methodPage():sectorPage(S.find(s=>"s:"+s.id===t)||S[0]))+legend();
  mountViewer();applyLive();
}
function legend(){return `<div class="legend">颜色约定：<span class="up">红涨</span> / <span class="down">绿跌</span>；情绪热度 <span style="color:var(--cold)">蓝 = 悲观</span>、<span style="color:var(--hot)">橙 = 乐观</span>。所有分数和信号都是按固定规则从公开数据算出来的信息整理，每一项都附有依据，仅供个人研究参考，不构成投资建议。数据来源：Yahoo Finance（行情 / 财报 / 一致预期）、SEC EDGAR（RPO、8-K）、CNN（恐贪指数）、Summizer 图谱（产业消息）。</div>`}

/* ---------- 总览 ---------- */
function overview(){
  const f=M.funding, s=M.sentiment;
  const fItems=f.items.map(i=>`<figure><figcaption><span>${esc(i.name)}</span><b class="num">${i.last}${i.unit}</b></figcaption>${line(i.series,{h:40})}<figcaption><span>一年 <span class="num ${cls(i.d1y)}">${has(i.d1y)?(i.d1y>0?"+":"")+(i.unit==="%"?(i.d1y*100).toFixed(0)+"bp":i.d1y.toFixed(1)):"—"}</span></span><span>分位 ${num(i.pct1y,0)}%</span></figcaption></figure>`).join("");

function finTable(rows,rpo,annual){
  if(!rows||!rows.length)return`<div class="empty">数据源没有提供。</div>`;

const LIVE={};let liveAt=null;
async function fetchLive(ts){
  for(let i=0;i<ts.length;i+=60){
    try{const r=await fetch("https://qt.gtimg.cn/q="+ts.slice(i,i+60).map(t=>"us"+t.replace("-",".")).join(","),{cache:"no-store"});
      const txt=new TextDecoder("gbk").decode(await r.arrayBuffer());
      txt.split(";").forEach(row=>{const m=row.match(/v_us([A-Z.]+)="(.*)"/);if(!m)return;const a=m[2].split("~"),p=parseFloat(a[3]);if(!(p>0))return;LIVE[m[1].replace(".","-")]={p,pct:parseFloat(a[32])/100,time:a[30],cn:a[1]}});
      liveAt=new Date()}catch(e){}}
  applyLive();
}
function applyLive(){
  document.querySelectorAll("[data-lp]").forEach(el=>{const l=LIVE[el.dataset.lp];if(l)el.textContent=l.p.toFixed(2)});
  document.querySelectorAll("[data-lc]").forEach(el=>{const l=LIVE[el.dataset.lc];if(l&&has(l.pct)){el.textContent=pct(l.pct,+(el.dataset.d||1));el.classList.remove("up","down");const k=cls(l.pct);k&&el.classList.add(k)}});
  document.querySelectorAll("[data-lt]").forEach(el=>{const l=LIVE[el.dataset.lt];if(l)el.innerHTML=`<i class="live"></i>${esc(l.cn||"")} · 报价时间 ${esc(l.time)}（美东）`});
  const el=$("#livest");if(el&&liveAt)el.innerHTML=`<i class="live"></i>实时报价 ${liveAt.toLocaleTimeString("zh-CN",{hour12:false})}（腾讯行情，每 2 分钟）`;
}

  <ul>${s.parts.map(p=>`<li><b style="color:var(--text)">${esc(p.name)}</b>（当前 ${esc(p.value)} → 热度 ${p.heat}）：${esc(p.rule)} <span class="src">来源：${esc(p.src)}</span></li>`).join("")}</ul>
  <p>分区：≤ 20 极度悲观；≤ 38 偏悲观；39~61 中性；62~77 偏乐观；≥ 78 极度乐观。分析逻辑：极度乐观时利好已被价格消化，再出利好也涨不动，存在回调风险；极度悲观时利空已充分定价，再出利空也跌不动，是找机会的窗口。</p>
  <p><b>个股热度</b>（三项平均）：RSI(14) 换算 (RSI − 30) ÷ 40 × 100；52 周区间位置 (现价 − 52周低) ÷ (52周高 − 52周低) × 100；偏离 200 日线 50 + 偏离幅度 × 125。分区：≤ 20 极度悲观，≤ 38 偏悲观，39~64 中性，65~79 偏乐观，≥ 80 极度乐观。</p></div>

  <div class="card" style="margin-top:12px"><h3 style="margin-top:0">四、浪的位置：一浪基础设备 → 二浪 B 端应用 → 三浪 C 端应用</h3>
  <p><b>怎么分浪：</b>每个零件人工标了属于哪一浪（见 3D 拆解页零件名旁的标签）。一个板块某一浪的“篮子”= 该板块所有属于这一浪的零件下的<b>人工确认且纯正</b>的公司（标 ◦ 的多元化公司和“自动”发现的公司不算）。少于 3 家不做判断。</p>
  <p><b>六项检查</b>（每个板块页的浪位卡片上逐项列出当前值）：</p>
  <ul><li>价格 ①相对强度：篮子等权平均近 3 个月涨幅 − 标普500 &gt; 2%</li><li>价格 ②上涨广度：站上 50 日线的公司占比 ≥ 55%</li><li>财报 ③收入增速：最新一季收入同比的中位数 ≥ 15%</li><li>财报 ④毛利率（代表产品力）：毛利率同比改善的公司占比 ≥ 55%</li><li>财报 ⑤EBITDA 利润率（代表经营效率）：同比改善的公司占比 ≥ 55%</li><li>财报 ⑥RPO（长期大单）：披露 RPO 的公司中，RPO 同比增速中位数 ≥ 15%</li></ul>
  <p><b>阶段判定</b>（从上往下，命中第一条就停）。“财报强”= 财报四项里满足 ≥ 2 项且 ≥ 60%；“已涨过”= 篮子过去一年涨幅中位数 ≥ 40%：</p>
  <div class="tw" style="border:0"><table class="calc"><tr><th class="l">条件</th><th class="l">阶段</th></tr>
  <tr><td class="l">RSI 中位数 ≥ 68，且 ≥ 85% 的公司站上 200 日线，且近 6 个月涨幅中位数 ≥ 50%</td><td class="l lv4">主升浪后段 / 过热</td></tr>
  <tr><td class="l">价格两项都满足 + 财报强</td><td class="l lv3">主升浪进行中</td></tr>
  <tr><td class="l">价格满足一项 + 财报强 + 已涨过</td><td class="l lv3">主升浪中的整理</td></tr>
  <tr><td class="l">价格满足一项 + 财报强 + 没涨过</td><td class="l lv2">启动初期</td></tr>
  <tr><td class="l">价格都不满足 + 财报强 + 已涨过</td><td class="l lv2">回调中（财报仍在改善）</td></tr>
  <tr><td class="l">价格都不满足 + 财报强 + 没涨过</td><td class="l lv1">财报已改善，价格未反映</td></tr>
  <tr><td class="l">价格满足至少一项，财报不强</td><td class="l lv1">价格先行，财报待验证</td></tr>
  <tr><td class="l">以上都不是</td><td class="l lv0">尚未启动</td></tr></table></div>
  <p><b>“分化上涨”标记：</b>篮子近 3 个月上涨，成分股涨幅的四分位差 ≥ 25 个百分点，且站上 50 日线的占比在 35%~75% 之间——说明资金在挑真正受益的公司，而不是普涨。</p>
  <p><b>IGV 检查</b>（你提到的二浪判据，总览页）：上涨 = IGV 近 3 个月涨幅 &gt; 3%（当前 ${pct(g.igv_r3m,1)}）；分化 = IGV 前十大持仓近 3 个月涨幅最高与最低之差 ≥ 35 个百分点（当前 ${pct0(g.spread)}），且上涨的只数占 30%~80%（当前 ${pct0(g.up_share)}）。两者都成立才算“有分化的上涨”。另看 IGV ÷ SMH 比值的走势：上行表示资金从硬件转向软件。来源：Yahoo Finance 的 IGV、SMH 及前十大持仓日线。</p>
  <p><b>局限：</b>毛利率和 EBITDA 的“同比”只能比最新一季（数据源只给 5 个季度），看不到趋势是否在加速；篮子是等权的，小公司和大公司一票一权。</p></div>

  <div class="card" style="margin-top:12px"><h3 style="margin-top:0">五、个股：基本面、预期面、点位信号</h3>
  <p><b>基本面</b>（内在价值在变好还是变差）：50 分起。收入同比 × 60（±15）；毛利率同比每变化 1 个百分点 ±3 分（±10）；EBITDA 利润率每 1 个百分点 ±2 分（±10）；EPS 同比 × 15（±7.5）；近四季自由现金流率 × 40（±7.5）；RPO 同比 × 10（−3~+5）。至少要有两项数据才出分。</p>
  <p><b>预期面</b>（现实与预期的差距 = 上涨空间）：50 分起。现价距分析师一致目标价的空间 × 80（−20~+25，至少 3 位分析师）；近 90 天下财年 EPS 预测的修正幅度 × 100（±15）——预期在上修说明现实比预期好；上次财报 EPS 超预期幅度 × 100（±8）；分析师评级均值 (2.5 − 评级) × 4（±5，1 = 强买，5 = 卖出）。</p>
  <p><b>点位信号</b>（基本面 × 预期面 × 个股热度）：“基本面好”= ≥ 60 分；“预期好”= ≥ 58 分。</p>
  <div class="tw" style="border:0"><table class="calc"><tr><th class="l">条件</th><th class="l">信号</th><th class="l">含义</th></tr>
  <tr><td class="l">热度 ≤ 38，基本面好，预期好</td><td class="l"><span class="chip sig2">关注买点</span></td><td class="l">好公司处在悲观区，利空大概率已定价。如果公司还在大幅亏损（EBITDA 率或自由现金流率低于 −50%），降为“观察”</td></tr>
  <tr><td class="l">热度 ≤ 38，两项只满足一项</td><td class="l"><span class="chip sig1">观察</span></td><td class="l">等另一项确认，通常是下一次财报</td></tr>
  <tr><td class="l">热度 ≤ 38，两项都不满足</td><td class="l"><span class="chip sig0">弱势</span></td><td class="l">便宜可能有便宜的道理</td></tr>
  <tr><td class="l">热度 ≥ 80</td><td class="l"><span class="chip sig-2">回调风险</span></td><td class="l">利好大概率已被消化</td></tr>
  <tr><td class="l">热度 65~79，且两项没有同时满足</td><td class="l"><span class="chip sig-1">谨慎</span></td><td class="l">价格偏热而基本面 / 预期没跟上</td></tr>
  <tr><td class="l">热度 39~79，基本面好，预期好</td><td class="l"><span class="chip sig1">趋势中</span></td><td class="l">趋势中段，等回踩均线</td></tr>
  <tr><td class="l">其余</td><td class="l"><span class="chip sig0">中性</span></td><td class="l">没有明显错配</td></tr></table></div></div>

  <div class="card" style="margin-top:12px"><h3 style="margin-top:0">六、推送什么、什么时候推</h3>
  <p>每次定时刷新后，和上一次保存的状态对比，只有发生变化才推：</p>
  <ul><li>新财报落地：数据源里某家公司的“最新季度截止日”变新了 → 推送收入同比、毛利率及变化、EBITDA 利润率、EPS 超预期幅度、RPO 同比、当前信号</li><li>某只股票的点位信号变为「关注买点」或「回调风险」</li><li>某个板块某一浪的阶段发生变化</li><li>VIX 跨入 ≥ 30（极度恐慌）、≥ 22（恐慌升温）、≤ 13（过度平静）；市场综合情绪进入极度悲观 / 极度乐观</li><li>IGV“分化上涨”信号出现或消失</li><li>财报日 3 天内提醒（每个财报日只提醒一次，附一致预期 EPS）</li><li>单日涨跌超过 8%</li></ul>
  <p>单次刷新最多推 12 条，其余合并成一条。及时程度取决于定时任务的频率：默认交易时段每 30 分钟一次，盘后再跑三次（抓盘后财报）。数据源（Yahoo）自身更新新财报通常滞后发布几小时到一天，财报页会同时列出 SEC 8-K 原文链接，那是最快的一手来源。</p></div>
  </div>`;
}

    <div class="card facet"><h3>④ 资金面 · 贵不贵、钱有没有进来 <em>${a.score??"—"}</em></h3>
      <ul class="why">${a.why.map(w=>`<li>${esc(w)}</li>`).join("")}<li>大环境：${esc(M.funding.regime)}（${esc(M.funding.why[0]||"")}）</li></ul>
      <div class="kv"><div><span>远期 PE</span><b class="num">${num(a.fpe)}</b></div><div><span>静态 PE</span><b class="num">${num(a.pe)}</b></div><div><span>PEG</span><b class="num">${num(a.peg,2)}</b></div><div><span>市销率</span><b class="num">${num(a.ps)}</b></div><div><span>EV/EBITDA</span><b class="num">${num(a.ev_ebitda)}</b></div><div><span>机构持股</span><b class="num">${pct0(a.inst)}</b></div><div><span>做空比例</span><b class="num">${pct0(a.short,1)}</b></div><div><span>日均成交额</span><b class="num">${money(k.dv20)}</b></div></div></div>
    <div class="card facet" style="grid-column:1/-1"><h3>⑤ 情绪面 · 具体点位 <em>${c.heat??"—"}</em></h3>${heatBar(c.heat)}
      <ul class="why">${c.heat_why.map(w=>`<li>${esc(w)}</li>`).join("")}<li>大盘情绪：${esc(M.sentiment.zone)}（热度 ${M.sentiment.heat}）——${esc(M.sentiment.verdict)}</li></ul></div>
  </div>
  ${finSection(t,c)}
  ${(c.notes||[]).length?`<h2>重大消息判断</h2>${c.notes.map(n=>`<div class="note"><b>${esc(n.date||"")}</b> ${esc(n.text||"")}${n.url?` <a href="${safeUrl(n.url)}" target="_blank" rel="noopener">来源</a>`:""}</div>`).join("")}`:""}
  <div class="grid g2" style="margin-top:12px">
    <div class="card"><h3>重大事件公告（SEC 8-K，近 60 天）</h3>${(c.filings||[]).length?`<ul class="feed">${c.filings.map(x=>`<li><a href="${safeUrl(x.url)}" target="_blank" rel="noopener">${esc(x.items.join(" · ")||"8-K")}</a><div class="m">${esc(x.date)}</div></li>`).join("")}</ul>`:`<div class="empty">近 60 天没有 8-K（或不是按美国本土公司格式披露）。</div>`}</div>
    <div class="card"><h3>最新新闻</h3>${c.news.length?`<ul class="feed">${c.news.map(x=>`<li><a href="${safeUrl(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a><div class="m">${esc(x.date)} · ${esc(x.src)}</div></li>`).join("")}</ul>`:`<div class="empty">暂无</div>`}</div>
  </div>
  ${c.relations.length?`<div class="card" style="margin-top:12px"><h3>图谱关系（来自 Summizer，每条都有原文来源）</h3><ul class="feed">${c.relations.map(r=>`<li><span class="chip">${REL[r.type]||esc(r.type)}</span> <b>${esc(r.other)}</b> — ${esc(r.desc)} ${r.url?`<a class="m" href="${safeUrl(r.url)}" target="_blank" rel="noopener">来源</a>`:""}</li>`).join("")}</ul></div>`:""}`;
  $("#modal").classList.add("on");$("#modal").scrollTop=0;document.body.style.overflow="hidden";fetchLive([t]);
}
function closeCo(){$("#modal").classList.remove("on");document.body.style.overflow=""}
function jump(sid,cid,nid){closeCo();state.prod[sid]=cid;state.part[sid+"/"+cid]=nid;state.tab="s:"+sid;history.replaceState(null,"","#s:"+sid);render();setTimeout(()=>{const el=$("#pv");el&&el.scrollIntoView({behavior:"smooth",block:"start"})},50)}
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeCo()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCo()});
$("#q").addEventListener("input",()=>{if(state.tab!=="all"){state.tab="all";history.replaceState(null,"","#all")}render()});
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter"){const t=e.target.value.trim().toUpperCase();if(C[t])openCo(t)}});

const gen=new Date(DATA.generated);
{const lag=(Date.now()-new Date(DATA.as_of+"T21:00:00Z"))/864e5;if(lag>4)document.querySelector("main").insertAdjacentHTML("beforebegin",`<div style="background:var(--hot);color:#000;text-align:center;padding:6px;font-size:13px">数据已经 ${Math.floor(lag)} 天没有更新（行情截至 ${DATA.as_of}）——自动刷新可能没有在运行，请检查电脑是否开机 / 是否睡眠。</div>`)}
$("#asof").textContent=`行情截至 ${DATA.as_of} · 生成于 ${gen.toLocaleString("zh-CN",{hour12:false})} · ${Object.keys(C).length} 家公司`;
const h0=decodeURIComponent(location.hash.slice(1)); if(TABS.some(t=>t[0]===h0))state.tab=h0;
render();
fetchLive(Object.keys(C));setInterval(liveLoop,120000);
</script>
</body>
</html>
